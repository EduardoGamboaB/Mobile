# Pipeline PRINCIPAL de despliegue del backend G3 (Cloud Build).
#
# Orden: seguridad → build → push → bootstrap de la base → migraciones →
# deploy por servicio (internos primero, gateway al final) → smoke test de
# /health y /ready vía el gateway → rollback automático si el smoke falla.
#
# La CONFIGURACIÓN de Cloud Run (cuentas, red, secretos, escalado, probes)
# es de Terraform (infra/terraform). Este pipeline solo cambia IMÁGENES.
#
# Se corre desde la RAÍZ del repo con la cuenta g3-deployer:
#   - Trigger de Terraform (google_cloudbuild_trigger.deploy): staging en cada
#     push a main; producción en tags vX.Y.Z con aprobación manual.
#   - Manual:
#       gcloud builds submit --config backend/infra/ci/cloudbuild.yaml \
#         --service-account=projects/<p>/serviceAccounts/g3-deployer@<p>.iam.gserviceaccount.com \
#         --substitutions _ENV=staging,_API_DOMAIN=api.staging.g3logistics.mx,SHORT_SHA=$(git rev-parse --short HEAD) .
#
# Rollback manual: docs/ops/RUNBOOK.md › Rollback.

substitutions:
  _ENV: staging
  _REGION: us-central1
  _API_DOMAIN: ''
  # Servicios HTTP (Cloud Run services g3-<svc>), en orden de despliegue.
  _SERVICES: 'integrations auth billing drivers fleet trips alerts ai'
  # Servicios con migraciones (jobs migrate-<svc>). Orden: auth primero.
  _MIGRATE: 'auth billing drivers fleet trips alerts integrations invoicing'
  # Imágenes que solo existen como job (sin servicio HTTP).
  _JOB_ONLY: 'invoicing'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  env:
    - 'REGISTRY=${_REGION}-docker.pkg.dev/${PROJECT_ID}/g3'
    - 'TAG=${SHORT_SHA}'

timeout: 3600s

steps:
  # ---------- SECURITY (pre-build, falla rápido) ----------
  - id: sec-gitleaks
    name: zricethezav/gitleaks:latest
    entrypoint: gitleaks
    args: ['detect', '--source=.', '--no-banner', '--redact', '--exit-code=1']
    waitFor: ['-']

  - id: sec-semgrep
    name: returntocorp/semgrep:latest
    entrypoint: semgrep
    args:
      - '--config=p/owasp-top-ten'
      - '--config=p/typescript'
      - '--config=p/secrets'
      - '--severity=ERROR'
      - '--error'
      - '--metrics=off'
      - '.'
    waitFor: ['-']

  - id: sec-npm-audit
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        for dir in backend mobile admin website; do
          if [ -f "$$dir/package-lock.json" ]; then
            echo "=== npm audit $$dir ==="
            (cd "$$dir" && npm audit --audit-level=high --omit=dev)
          fi
        done
    waitFor: ['-']

  # ---------- BUILD (en paralelo dentro de un paso) ----------
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        pids=()
        build() {
          docker build -q -f infra/docker/service.Dockerfile \
            --build-arg SERVICE="$$1" --build-arg GIT_SHA="$$TAG" \
            -t "$$REGISTRY/$$2:$$TAG" . > "/workspace/build-$$2.log" 2>&1 \
            || { echo "FALLÓ build $$2"; cat "/workspace/build-$$2.log"; return 1; }
          echo "ok $$2"
        }
        build gateway gateway & pids+=($$!)
        for s in ${_SERVICES} ${_JOB_ONLY}; do build "services/$$s" "$$s" & pids+=($$!); done
        docker build -q -f infra/db/Dockerfile -t "$$REGISTRY/db-bootstrap:$$TAG" infra/db & pids+=($$!)
        for p in "$${pids[@]}"; do wait "$$p"; done
    waitFor: ['sec-gitleaks', 'sec-semgrep', 'sec-npm-audit']

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pids=()
        for s in gateway ${_SERVICES} ${_JOB_ONLY} db-bootstrap; do
          docker push -q "$$REGISTRY/$$s:$$TAG" & pids+=($$!)
        done
        for p in "$${pids[@]}"; do wait "$$p"; done
    waitFor: ['build']

  # ---------- BASE: roles y permisos (idempotente) ----------
  - id: db-bootstrap
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs update g3-db-bootstrap --region=${_REGION} --image="$$REGISTRY/db-bootstrap:$$TAG" --quiet
        gcloud run jobs execute g3-db-bootstrap --region=${_REGION} --wait
    waitFor: ['push']

  # ---------- MIGRACIONES: ANTES de desplegar cualquier servicio ----------
  # Si una falla, el build se detiene y NINGÚN servicio se despliega.
  # Migraciones expand/contract: el código viejo debe funcionar con el
  # schema nuevo (docs/ops/RUNBOOK.md › Migraciones).
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for s in ${_MIGRATE}; do
          echo "=== migrate-$$s"
          gcloud run jobs update "migrate-$$s" --region=${_REGION} --image="$$REGISTRY/$$s:$$TAG" \
            --update-labels=commit-sha=$$TAG --quiet
          gcloud run jobs execute "migrate-$$s" --region=${_REGION} --wait
        done
        # El mantenimiento de telemetría usa la imagen de fleet.
        gcloud run jobs update g3-fleet-maintenance --region=${_REGION} --image="$$REGISTRY/fleet:$$TAG" --quiet
    waitFor: ['db-bootstrap']

  # Re-aplica init-schemas.sql: deja auth.audit_log append-only si la
  # migración de auth la acaba de crear.
  - id: db-harden
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['-c', 'gcloud run jobs execute g3-db-bootstrap --region=${_REGION} --wait']
    waitFor: ['migrate']

  # ---------- DEPLOY por servicio (internos → gateway) ----------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        : > /workspace/previous-revisions.txt
        for s in ${_SERVICES} gateway; do
          prev=$$(gcloud run services describe "g3-$$s" --region=${_REGION} \
                   --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "g3-$$s $$prev" >> /workspace/previous-revisions.txt
          echo "=== deploy g3-$$s (antes: $$prev)"
          gcloud run deploy "g3-$$s" --region=${_REGION} --image="$$REGISTRY/$$s:$$TAG" \
            --update-labels=commit-sha=$$TAG --quiet
          # Si un rollback fijó el tráfico a una revisión, volver a "latest".
          gcloud run services update-traffic "g3-$$s" --region=${_REGION} --to-latest --quiet
        done
        cat /workspace/previous-revisions.txt
    waitFor: ['db-harden']

  # ---------- SMOKE TEST vía gateway + rollback automático ----------
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        base="https://${_API_DOMAIN}"
        ok=0
        for i in $$(seq 1 12); do
          if curl -fsS --max-time 10 "$$base/health" >/dev/null && curl -fsS --max-time 10 "$$base/ready" >/dev/null; then
            ok=1; break
          fi
          echo "smoke: intento $$i falló; reintento en 10 s"; sleep 10
        done
        if [ "$$ok" = 1 ]; then echo "smoke OK ($$base)"; exit 0; fi
        echo "smoke FALLÓ: rollback de tráfico a las revisiones anteriores"
        while read -r svc rev; do
          [ -n "$$rev" ] || continue
          gcloud run services update-traffic "$$svc" --region=${_REGION} --to-revisions="$$rev=100" --quiet || true
        done < /workspace/previous-revisions.txt
        exit 1
    waitFor: ['deploy']
