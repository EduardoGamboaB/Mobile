# Cloud Build pipeline — build, push, deploy a Cloud Run.
# Trigger desde GitHub: push a main → deploy a prod.
# https://cloud.google.com/build/docs/build-config-file-schema

substitutions:
  _SERVICE: g3-backend
  _REGION: us-central1
  _CLOUD_SQL_INSTANCE: PROJECT:REGION:g3-postgres

steps:
  # 1. Build de la imagen
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE:latest
      - .

  # 2. Push a Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE']

  # 3. Deploy a Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --service-account=g3-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$_REGION
      - --set-secrets=DATABASE_URL=g3-db-url:latest,JWT_SECRET=g3-jwt-secret:latest,STRIPE_SECRET_KEY=g3-stripe-sk:latest,STRIPE_WEBHOOK_SECRET=g3-stripe-whsec:latest
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=20
      - --allow-unauthenticated

  # 4. Migrar DB (jobs ejecuta una sola vez)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - g3-backend-migrate
      - --region=$_REGION
      - --wait

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/g3/$_SERVICE:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
