# Cloud Run service manifest (declarativo). Aplicar con:
#   gcloud run services replace deploy/service.yaml --region=us-central1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: g3-backend
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:g3-postgres
    spec:
      serviceAccountName: g3-backend@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/g3/g3-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
            - name: GCP_REGION
              value: REGION
            - name: AI_PROVIDER
              value: vertex
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: g3-db-url, key: latest }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: g3-jwt-secret, key: latest }
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef: { name: g3-jwt-refresh-secret, key: latest }
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: g3-stripe-sk, key: latest }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: g3-stripe-whsec, key: latest }
