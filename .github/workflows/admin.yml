# CI de G3 Admin (Next.js export estático): lint, tipos, tests y build.
# La publicación al bucket + CDN se hace con admin/deploy/deploy.sh
# (variables de los outputs de Terraform; ver docs/ops/DEPLOY.md).
name: admin

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Build (export estático)
        env:
          NEXT_PUBLIC_G3_API_URL: https://api.example.invalid
        run: npm run build
      - run: npm audit --omit=dev --audit-level=high
