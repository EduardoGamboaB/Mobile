# CI del backend: typecheck, build, tests contra Postgres 16 y Redis 7
# reales, imágenes Docker y validación de los scripts de base de datos.
# El despliegue NO ocurre aquí (lo hace Cloud Build: backend/infra/ci/cloudbuild.yaml).
name: backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g3_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d g3_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/g3_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build de todos los workspaces
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (memoria + Postgres + Redis)
        run: npm test
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high

  database-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g3
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d g3"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: g3
    steps:
      - uses: actions/checkout@v4
      - name: init-schemas.sql (dos veces → idempotente)
        run: |
          for i in 1 2; do
            psql -v ON_ERROR_STOP=1 -X \
              -v pw_auth=ci-pw -v pw_billing=ci-pw -v pw_drivers=ci-pw -v pw_fleet=ci-pw \
              -v pw_trips=ci-pw -v pw_alerts=ci-pw -v pw_integrations=ci-pw -v pw_invoicing=ci-pw \
              -f infra/db/init-schemas.sql
          done
      - name: Aislamiento entre schemas
        run: |
          PGPASSWORD=ci-pw psql -U g3_fleet -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS fleet" -c "CREATE TABLE fleet.ci_probe(id text)"
          if PGPASSWORD=ci-pw psql -U g3_trips -c "SELECT * FROM fleet.ci_probe" 2>/dev/null; then
            echo "g3_trips pudo leer el schema fleet" && exit 1
          fi
          echo "OK: g3_trips no ve fleet"
      - name: docker compose config
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - services/auth
          - services/billing
          - services/drivers
          - services/fleet
          - services/trips
          - services/alerts
          - services/ai
          - services/integrations
          - services/invoicing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        run: |
          docker build -f infra/docker/service.Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} --build-arg GIT_SHA=${{ github.sha }} \
            -t g3-ci:${{ strategy.job-index }} .
      - name: Arranca como no-root y responde /health (servicios HTTP)
        if: matrix.service != 'services/invoicing'
        run: |
          test "$(docker run --rm --entrypoint id g3-ci:${{ strategy.job-index }} -u)" = "1000"
          docker run -d --name svc -e PORT=8080 -e NODE_ENV=development -p 8080:8080 g3-ci:${{ strategy.job-index }}
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && exit 0; sleep 1; done
          docker logs svc; exit 1

  db-bootstrap-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/db/Dockerfile -t g3-db-bootstrap:ci infra/db
