<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="Dashboard Monolith">
  <title>Dashboard tile · Monolith</title>
  <rect width="1400" height="800" fill="#F5F4F1"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1400" height="72" fill="#0B0D10"/>
  <!-- Mark mini en top bar -->
  <g transform="translate(32,18)" fill="#F5F4F1">
    <rect width="60" height="36" fill="none" stroke="#F5F4F1" stroke-width="1"/>
    <g fill="#F5F4F1" transform="translate(8,8)">
      <rect x="0" y="0" width="18" height="4"/>
      <rect x="0" y="0" width="4" height="20"/>
      <rect x="0" y="16" width="18" height="4"/>
      <rect x="14" y="10" width="4" height="10"/>
      <rect x="9" y="9" width="9" height="4"/>
      <rect x="24" y="0" width="18" height="4"/>
      <rect x="24" y="8" width="18" height="4"/>
      <rect x="24" y="16" width="18" height="4"/>
      <rect x="38" y="0" width="4" height="20"/>
    </g>
  </g>
  <text x="110" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F5F4F1" letter-spacing="4">G3 / OPERATIONS</text>
  <text x="1280" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9CA3AF" letter-spacing="2">SYS · OK</text>
  <circle cx="1265" cy="36" r="5" fill="#D72638"/>

  <!-- Side nav -->
  <rect x="0" y="72" width="80" height="728" fill="#1A1F26"/>

  <!-- Cards -->
  <g transform="translate(120, 110)">
    <!-- Card 1: Tractos activos -->
    <rect width="380" height="180" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">ACTIVE / IN-TRANSIT</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="58" font-weight="700" fill="#0B0D10" letter-spacing="-2">147</text>
    <text x="20" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9CA3AF">UNITS · LAST 60s</text>
    <line x1="20" y1="148" x2="120" y2="148" stroke="#D72638" stroke-width="3"/>
    <text x="20" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0B0D10">+12 · 24H</text>
  </g>

  <g transform="translate(520, 110)">
    <rect width="380" height="180" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">ON-TIME · MTD</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="58" font-weight="700" fill="#0B0D10" letter-spacing="-2">99.4<tspan font-size="38">%</tspan></text>
    <text x="20" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9CA3AF">SLA-A · 30D ROLLING</text>
  </g>

  <g transform="translate(920, 110)">
    <rect width="360" height="180" fill="#0B0D10"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">CRITICAL</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="58" font-weight="700" fill="#D72638" letter-spacing="-2">02</text>
    <text x="20" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F5F4F1">UNITS · ATTENTION REQUIRED</text>
    <rect x="20" y="146" width="180" height="22" fill="none" stroke="#D72638" stroke-width="1"/>
    <text x="32" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F4F1" letter-spacing="2">REVIEW NOW →</text>
  </g>

  <!-- Map area -->
  <g transform="translate(120, 320)">
    <rect width="780" height="380" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1"/>
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">FLEET MAP · MX TIER 1</text>
    <!-- mock map dots -->
    <g fill="#0B0D10">
      <circle cx="180" cy="200" r="5"/>
      <circle cx="240" cy="180" r="5"/>
      <circle cx="320" cy="220" r="5"/>
      <circle cx="420" cy="160" r="5"/>
      <circle cx="500" cy="240" r="5"/>
      <circle cx="580" cy="190" r="5"/>
      <circle cx="660" cy="280" r="5"/>
      <circle cx="380" cy="320" r="5"/>
    </g>
    <circle cx="420" cy="160" r="10" fill="none" stroke="#D72638" stroke-width="2"/>
  </g>

  <!-- Right column -->
  <g transform="translate(920, 320)">
    <rect width="360" height="180" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">REVENUE · MTD</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#0B0D10">$8.41M</text>
    <text x="20" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF">MXN · NET</text>
  </g>
  <g transform="translate(920, 520)">
    <rect width="360" height="180" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">AI ASSIST · 24H</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#0B0D10">12,840</text>
    <text x="20" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF">INFERENCES · 6 AGENTS</text>
  </g>
</svg>
