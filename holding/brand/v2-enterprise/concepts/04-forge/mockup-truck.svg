<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-label="Tracto Forge">
  <title>Tracto · Forge</title>
  <rect width="1400" height="600" fill="#EFEAE0"/>
  <line x1="0" y1="500" x2="1400" y2="500" stroke="#0E1112" stroke-dasharray="2 4"/>
  <!-- CAJA -->
  <rect x="20" y="180" width="780" height="280" fill="#0E1112"/>
  <!-- Líneas industriales -->
  <rect x="20" y="220" width="780" height="2" fill="#3A3F45"/>
  <rect x="20" y="438" width="780" height="2" fill="#3A3F45"/>
  <rect x="20" y="448" width="780" height="6" fill="#CC2229"/>
  <!-- Escudo centrado -->
  <g transform="translate(120,240)">
    <polygon points="40,20 200,20 230,100 200,180 40,180 10,100" fill="#3A3F45"/>
    <polygon points="55,32 185,32 212,100 185,168 55,168 28,100" fill="#0E1112"/>
    <polygon points="55,160 185,160 185,168 55,168" fill="#CC2229"/>
    <text x="120" y="130" font-family="'Oswald', sans-serif" font-size="100" font-weight="700" fill="#EFEAE0" text-anchor="middle" letter-spacing="-1">G3</text>
    <text x="120" y="194" font-family="'Oswald', sans-serif" font-size="9" font-weight="600" fill="#EFEAE0" text-anchor="middle" letter-spacing="3">MX · EST. 2018</text>
  </g>
  <text x="380" y="320" font-family="'Oswald', sans-serif" font-size="70" font-weight="700" fill="#EFEAE0" letter-spacing="2">LOGISTICS</text>
  <rect x="380" y="338" width="280" height="4" fill="#CC2229"/>
  <text x="380" y="376" font-family="'Oswald', sans-serif" font-size="14" font-weight="600" fill="#A1A6AB" letter-spacing="4">HEAVY DUTY · DIGITAL CORE</text>
  <text x="380" y="404" font-family="'Roboto Mono', monospace" font-size="11" fill="#A1A6AB" letter-spacing="3">UNIT 0042 · DRY VAN 53FT</text>
  <circle cx="180" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
  <circle cx="280" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
  <circle cx="700" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
  <!-- TRACTO -->
  <g>
    <path d="M 820,460 L 820,340 L 900,260 L 1080,260 L 1080,460 Z" fill="#0E1112"/>
    <rect x="1080" y="380" width="40" height="80" fill="#0E1112"/>
    <path d="M 920,280 L 1060,280 L 1060,350 L 850,350 Z" fill="#3A3F45"/>
    <rect x="820" y="444" width="300" height="6" fill="#CC2229"/>
    <!-- Mini escudo puerta -->
    <g transform="translate(975,375)">
      <polygon points="15,5 60,5 70,30 60,55 15,55 5,30" fill="#3A3F45"/>
      <polygon points="20,10 55,10 64,30 55,50 20,50 11,30" fill="#0E1112"/>
      <text x="38" y="40" font-family="'Oswald', sans-serif" font-size="28" font-weight="700" fill="#EFEAE0" text-anchor="middle">G3</text>
    </g>
    <circle cx="900" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
    <circle cx="1010" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
    <circle cx="1100" cy="500" r="38" fill="#0E1112" stroke="#CC2229" stroke-width="2"/>
  </g>
</svg>
