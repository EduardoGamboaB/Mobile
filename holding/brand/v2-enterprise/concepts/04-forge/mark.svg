<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-label="G3 Forge">
  <title>G3 — Concepto Forge</title>
  <!-- Escudo hexagonal de bordes biselados -->
  <defs>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3F45"/>
      <stop offset="100%" stop-color="#0E1112"/>
    </linearGradient>
  </defs>
  <!-- Hex outer -->
  <polygon points="50,40 270,40 310,140 270,240 50,240 10,140" fill="url(#bevel)"/>
  <!-- Hex inner (bisel interno) -->
  <polygon points="68,58 252,58 286,140 252,222 68,222 34,140" fill="#0E1112"/>
  <!-- Borde inferior caterpillar red -->
  <polygon points="68,210 252,210 252,222 68,222" fill="#CC2229"/>
  <!-- G3 stencil -->
  <text x="160" y="178"
        font-family="'Oswald', 'Bebas Neue', 'Arial Narrow', sans-serif"
        font-size="140" font-weight="700"
        fill="#EFEAE0"
        text-anchor="middle"
        letter-spacing="-2">G3</text>
  <!-- Marca técnica -->
  <text x="160" y="248"
        font-family="'Oswald', 'Bebas Neue', sans-serif"
        font-size="11" font-weight="600"
        fill="#0E1112"
        text-anchor="middle"
        letter-spacing="5">MX · EST. 2018</text>
</svg>
