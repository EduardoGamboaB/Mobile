<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-label="Tracto Pulse">
  <title>Tracto · Pulse</title>
  <rect width="1400" height="600" fill="#FAFAF7"/>
  <line x1="0" y1="500" x2="1400" y2="500" stroke="#0D0F12" stroke-dasharray="2 6"/>
