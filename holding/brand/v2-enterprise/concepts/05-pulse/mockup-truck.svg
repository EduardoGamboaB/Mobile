  <rect x="20" y="450" width="780" height="1" fill="#0D0F12"/>
  <text x="20" y="478" font-family="'Inter', monospace" font-size="11" fill="#535862" letter-spacing="2">UNIT-0042 · 53' DRY VAN · MX</text>
  <circle cx="180" cy="500" r="38" fill="#0D0F12"/>
  <circle cx="280" cy="500" r="38" fill="#0D0F12"/>
  <circle cx="700" cy="500" r="38" fill="#0D0F12"/>
  <!-- TRACTO -->
  <g>
    <path d="M 820,460 L 820,340 L 900,260 L 1080,260 L 1080,460 Z" fill="#FAFAF7" stroke="#0D0F12" stroke-width="1.5"/>
    <rect x="1080" y="380" width="40" height="80" fill="#FAFAF7" stroke="#0D0F12" stroke-width="1.5"/>
    <path d="M 920,280 L 1060,280 L 1060,350 L 850,350 Z" fill="#E5E7EB"/>
    <!-- Solo el monograma G3 en la puerta -->
    <text x="980" y="430" font-family="'PP Editorial New', serif" font-size="48" font-weight="500" font-style="italic" fill="#0D0F12" letter-spacing="-2">G3</text>
    <circle cx="1042" cy="408" r="3" fill="#0066FF"/>
    <circle cx="900" cy="500" r="38" fill="#0D0F12"/>
    <circle cx="1010" cy="500" r="38" fill="#0D0F12"/>
    <circle cx="1100" cy="500" r="38" fill="#0D0F12"/>
