  <rect x="20" y="180" width="780" height="280" fill="#FAFAF7" stroke="#0D0F12" stroke-width="1.5"/>
  <!-- Wordmark grande en italic editorial -->
  <text x="180" y="300" font-family="'PP Editorial New', 'Söhne', serif" font-size="100" font-weight="500" font-style="italic" fill="#0D0F12" letter-spacing="-5">G3</text>
  <circle cx="290" cy="265" r="5" fill="#0066FF"/>
  <text x="310" y="282" font-family="'Inter', sans-serif" font-size="48" font-weight="500" fill="#0D0F12" letter-spacing="-1">Logistics</text>
  <text x="310" y="312" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#535862" letter-spacing="2">INTELLIGENT FREIGHT INFRASTRUCTURE</text>
